[project]
name = "llm-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "podman>=5.8",
]

[project.scripts]
llm-optimization = "llm_optimization:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
# Match the interpreter pinned in .python-version / requires-python.
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle (imports, statements, syntax errors)
# F: pyflakes | I: isort | UP: pyupgrade
# B: flake8-bugbear | SIM: flake8-simplify | C4: flake8-comprehensions
# RUF: Ruff-specific rules
# E501 is intentionally omitted: the formatter owns line wrapping.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
# Integration tests require a running Podman daemon; skip them unless
# explicitly requested with `pytest -m integration`.
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running Podman daemon",
]
