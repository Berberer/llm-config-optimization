[project]
name = "llm-config-optimization"
version = "0.1.0"
description = "Search an LLM serving configuration for the highest token throughput"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.2.0",
    "optuna>=5.0",
    "plotext>=6.1.0",
    "podman>=5.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
llm-config-optimization = "llm_config_optimization:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.89",
]

[tool.ruff]
# Match the interpreter pinned in .python-version / requires-python.
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle (imports, statements, syntax errors)
# F: pyflakes | I: isort | UP: pyupgrade
# B: flake8-bugbear | SIM: flake8-simplify | C4: flake8-comprehensions
# RUF: Ruff-specific rules
# E501 is intentionally omitted: the formatter owns line wrapping.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ty.environment]
# Match the interpreter pinned in .python-version / requires-python.
python-version = "3.14"

[tool.ty.src]
# Tests drive hand-written fakes that deliberately do not implement every
# protocol member, so type checking is scoped to the library sources.
exclude = ["tests"]

[tool.pytest.ini_options]
# Integration tests require a running Podman daemon; skip them unless
# explicitly requested with `pytest -m integration`.
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running Podman daemon",
]
