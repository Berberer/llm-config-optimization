# The complete vLLM search space with the speculative trade-off in the sweep:
# every trial either runs with the configured setup or with no speculative
# flags at all, and the enabled trials sample one of four draft depths.
# Configure the method and the optional draft model on the command line, for
# example:
#
#   --speculative-method eagle3 --draft-model Qwen/Qwen3.8-27B-EAGLE3
#
# A disabled trial frees the draft model's memory, which is what makes an
# on/off comparison on constrained hardware meaningful. The depth is sampled on
# every trial but only applied when the mode is enabled, so disabled points can
# repeat across depth values; this is expected and harmless to the optimizer.
#
# `tensor_parallel_size` and `attention_backend` defer to the engine because
# both depend on the host. Pin either one only when the target is known to
# support it.
space:
  dtype:
    categorical: [auto, float16, bfloat16, float32]
  kv_cache_dtype:
    categorical: [auto, float16, bfloat16, fp8_e4m3, fp8_e5m2]
  max_model_len:
    interval:
      min: 1024
      max: 32768
  max_num_seqs:
    interval:
      min: 1
      max: 256
  max_num_batched_tokens:
    interval:
      min: 2048
      max: 8192
  tensor_parallel_size:
    default: true
  attention_backend:
    default: true
  speculative_mode:
    categorical: [enabled, disabled]
  num_speculative_tokens:
    categorical: [1, 2, 4, 8]
