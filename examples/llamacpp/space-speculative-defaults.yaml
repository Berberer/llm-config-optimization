# The complete llama.cpp search space with speculative decoding enabled at the
# engine's own defaults and the draft-only knobs left to the engine. This space
# requires a separate draft model. Configure the method and the draft model on
# the command line, for example:
#
#   --speculative-method draft_model --draft-model path/to/draft.gguf
#
# A configured speculative setup makes both speculative dimensions mandatory,
# and a configured draft makes the six draft-only dimensions mandatory. A
# `default: true` means the engine's own value: on `speculative_mode` it is
# *enabled* — the setup's default, not llama.cpp's no-speculation default — on
# `num_speculative_tokens` it omits `--spec-draft-n-max`, and on each draft-only
# dimension it omits that flag so llama.cpp decides.
#
# Only the parameters llama-server forwards are declared, in canonical registry
# order; `dtype` and `tensor_parallel_size` are not applicable to a GGUF
# checkpoint. The slot cap and context-size notes from `space-full.yaml` apply
# unchanged.
space:
  max_model_len:
    interval:
      min: 18432
      max: 32768
  max_num_seqs:
    interval:
      min: 1
      max: 256
  max_num_batched_tokens:
    interval:
      min: 2048
      max: 8192
  ubatch_size:
    default: true
  kv_cache_dtype:
    categorical: [float16, bfloat16, float32, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1]
  attention_backend:
    categorical: [auto, flash_attention]
  n_gpu_layers:
    default: true
  n_cpu_moe:
    default: true
  n_cpu_ffn:
    default: true
  kv_offload:
    default: true
  op_offload:
    default: true
  host_buffer:
    default: true
  repack:
    default: true
  swa_full:
    default: true
  load_mode:
    default: true
  prefix_caching:
    fixed: true
  cache_ram:
    default: true
  ctx_checkpoints:
    default: true
  checkpoint_min_step:
    default: true
  kv_unified:
    default: true
  continuous_batching:
    default: true
  cache_idle_slots:
    default: true
  speculative_mode:
    default: true
  num_speculative_tokens:
    default: true
  spec_draft_n_min:
    default: true
  spec_draft_p_split:
    default: true
  spec_draft_sampling:
    default: true
  n_gpu_layers_draft:
    default: true
  n_cpu_moe_draft:
    default: true
  draft_kv_cache_dtype:
    default: true
  threads:
    default: true
  threads_batch:
    default: true
  poll:
    default: true
  prio:
    default: true
