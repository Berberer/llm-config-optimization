# A llama.cpp sweep over Mixture-of-Experts CPU offload: `n_cpu_moe` compares
# no expert offload (`0`), two partial counts, and `all`.
#
# `--n-cpu-moe N` keeps the expert weights of the first N layers in system RAM
# while attention and the KV cache stay on the GPU, so a GPU host can trade
# expert compute against VRAM. `--cpu-moe` (`all`) keeps every expert layer on
# the CPU, and `0` is the offload-off baseline.
#
# Exact counts are checkpoint-specific: llama.cpp accepts a count up to the
# model's block count, and the loader cannot know that number from the space
# alone. The counts below fit many current MoE checkpoints, but adjust them to
# the model you serve. A count above the checkpoint's block count is rejected
# after the model resolves rather than silently clamped; `all` names the full
# offload without knowing the layer count.
#
# Every other tunable is pinned so the comparison isolates the expert offload.
# `n_gpu_layers: all` offloads every layer to the GPU, which is what makes the
# CPU placement of the experts meaningful, so this space is GPU-only. On a
# CPU-only host the assessment drops `n_cpu_moe`, because no weight ever leaves
# system RAM there.
#
# Only the parameters llama-server forwards are declared, in canonical registry
# order. `dtype` and `tensor_parallel_size` are not applicable to a GGUF
# checkpoint, and the draft-only dimensions stay out because no `--draft-model`
# is configured.
space:
  max_model_len:
    fixed: 4096
  max_num_seqs:
    fixed: 64
  max_num_batched_tokens:
    fixed: 4096
  ubatch_size:
    default: true
  kv_cache_dtype:
    fixed: float16
  attention_backend:
    default: true
  n_gpu_layers:
    fixed: all
  n_cpu_moe:
    categorical: [0, 8, 16, all]
  n_cpu_ffn:
    default: true
  kv_offload:
    default: true
  op_offload:
    default: true
  host_buffer:
    default: true
  repack:
    default: true
  swa_full:
    default: true
  load_mode:
    default: true
  prefix_caching:
    fixed: true
  cache_ram:
    default: true
  ctx_checkpoints:
    default: true
  checkpoint_min_step:
    default: true
  kv_unified:
    default: true
  continuous_batching:
    default: true
  cache_idle_slots:
    default: true
  threads:
    default: true
  threads_batch:
    default: true
  poll:
    default: true
  prio:
    default: true
