# A llama.cpp sweep over GPU offload: every other tunable is pinned so the
# comparison isolates `n_gpu_layers`. `auto` lets llama.cpp choose how many
# layers to offload, `0` keeps the model entirely on the CPU, and `all` offloads
# every layer. The three points span the offload spectrum on any GPU host.
#
# This space is GPU-only in the sense that `all` needs an accelerator; on a
# CPU-only host it is rejected before the sweep. Drop `all` from the list (or
# use `space-full.yaml`) to keep a CPU host runnable.
#
# Exact layer counts are checkpoint-specific: llama.cpp accepts any count up to
# the model's block count, and the loader cannot know that number from the
# space alone. After reading the checkpoint's `<arch>.block_count` metadata, add
# the counts you want to compare, for example `categorical: [auto, 0, 8, 16, all]`;
# a count above the block count is rejected by the model-aware validation.
#
# Only the parameters llama-server forwards are declared, in canonical registry
# order. `dtype` and `tensor_parallel_size` are not applicable to a GGUF
# checkpoint. `n_cpu_moe` defers to the engine so it stays out of this
# GPU-offload comparison, and the draft-only dimensions stay out because no
# `--draft-model` is configured.
space:
  max_model_len:
    fixed: 4096
  max_num_seqs:
    fixed: 64
  max_num_batched_tokens:
    fixed: 4096
  ubatch_size:
    default: true
  kv_cache_dtype:
    fixed: float16
  attention_backend:
    default: true
  n_gpu_layers:
    categorical: [auto, 0, all]
  n_cpu_moe:
    default: true
  n_cpu_ffn:
    default: true
  kv_offload:
    default: true
  op_offload:
    default: true
  host_buffer:
    default: true
  repack:
    default: true
  swa_full:
    default: true
  load_mode:
    default: true
  prefix_caching:
    fixed: true
  cache_ram:
    default: true
  ctx_checkpoints:
    default: true
  checkpoint_min_step:
    default: true
  kv_unified:
    default: true
  continuous_batching:
    default: true
  cache_idle_slots:
    default: true
  threads:
    default: true
  threads_batch:
    default: true
  poll:
    default: true
  prio:
    default: true
