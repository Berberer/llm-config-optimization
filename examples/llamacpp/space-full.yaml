# The complete llama.cpp search space: only the eight parameters llama-server
# forwards are declared. `dtype` and `tensor_parallel_size` are not applicable
# and must be omitted — a GGUF checkpoint carries its own numerical format, and
# llama.cpp spreads requests over `--parallel` slots rather than tensor-parallel
# ranks. Declaring either one makes the llama.cpp backend reject the space.
#
# Each dimension maps to a real llama-server flag: `kv_cache_dtype` to
# `--cache-type-k`/`--cache-type-v`, `max_model_len` to `--ctx-size`,
# `max_num_seqs` to `--parallel`, `max_num_batched_tokens` to `--batch-size`
# and `--ubatch-size`, `attention_backend` to `--flash-attn`, `prefix_caching`
# to `--cache-prompt`/`--no-cache-prompt`, `n_gpu_layers` to `--n-gpu-layers`,
# and `n_cpu_moe` to `--n-cpu-moe` or the value-less `--cpu-moe`.
#
# `n_gpu_layers` and `n_cpu_moe` defer to the engine so this space stays
# host-agnostic; sweep them explicitly on a GPU host to compare partial and
# full offload, and on an MoE checkpoint to trade expert compute against VRAM.
#
# The enum ranges list only values llama.cpp can serve: the float and quantized
# cache formats are modelled, while `auto` and the FP8 members have no KV-cache
# spelling here. Quantized formats trade cache precision for memory, so a sweep
# can measure that trade against the float baseline. llama.cpp requires flash
# attention for a quantized V cache, so `attention_backend` offers only `auto`
# (let the engine choose) and `flash_attention` (force it on); a space that can
# pair a quantized cache with `off` is rejected before the sweep starts.
#
# llama.cpp divides `--ctx-size` evenly across the `--parallel` slots, so the
# backend caps the slot count at `max_model_len // (input_len + output_len)`
# (at least one). The sampled `max_model_len` is always sent as `--ctx-size`
# unchanged: a point below the benchmark's request length cannot be served at
# any slot count and its trial fails, so keep this interval's floor above
# `--input-len + --output-len` for a sweep that never fails on context size.
# `max_num_batched_tokens` is independent: it sizes both the logical
# `--batch-size` and the physical `--ubatch-size`, and upstream clamps them to
# the context size rather than rejecting.
space:
  kv_cache_dtype:
    categorical: [float16, bfloat16, float32, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1]
  max_model_len:
    interval:
      min: 1024
      max: 32768
  max_num_seqs:
    interval:
      min: 1
      max: 256
  max_num_batched_tokens:
    interval:
      min: 2048
      max: 8192
  attention_backend:
    categorical: [auto, flash_attention]
  prefix_caching:
    categorical: [true, false]
  n_gpu_layers:
    default: true
  n_cpu_moe:
    default: true
